name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts/container-smoke.py
      - run: ruff format --check backend scripts/container-smoke.py
      - run: pytest -q
      - run: npm test
      - run: npm run test:integration
        env:
          PYTHON: python
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t upwind-mail-guard:ci .
      - run: python scripts/container-smoke.py upwind-mail-guard:ci
